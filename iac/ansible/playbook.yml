---
- name: Provision GitLab Server in VirtualBox Linux VM
  hosts: gitlab_servers
  become: true
  vars:
    gitlab_edition: "gitlab-ce"
    gitlab_install_method: "omnibus"
    gitlab_external_url: "http://localhost:8080"
    gitlab_external_port: 8080
    gitlab_ssh_port: 2222
    gitlab_initial_root_password: "GitLabRoot!2026"
    gitlab_puma_workers: 2
    gitlab_sidekiq_concurrency: 10
    gitlab_prometheus_enable: false

  tasks:
    - name: Wait for cloud-init / system boot to complete
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false

    - name: Ensure prerequisite packages are installed
      ansible.builtin.apt:
        name:
          - curl
          - openssh-server
          - ca-certificates
          - tzdata
          - perl
          - jq
          - gnupg
          - apt-transport-https
        state: present
        update_cache: true

    - name: Provision GitLab via Omnibus package
      when: gitlab_install_method == "omnibus"
      block:
        - name: Check if GitLab APT repository is already configured
          ansible.builtin.stat:
            path: "/etc/apt/sources.list.d/gitlab_{{ gitlab_edition }}.list"
          register: gitlab_repo_stat

        - name: Download and run official GitLab repository setup script
          when: not gitlab_repo_stat.stat.exists
          ansible.builtin.shell: |
            set -eo pipefail
            curl -fsSL "https://packages.gitlab.com/install/repositories/gitlab/{{ gitlab_edition }}/script.deb.sh" | bash
          args:
            executable: /bin/bash

        - name: Install GitLab Omnibus package ({{ gitlab_edition }})
          ansible.builtin.apt:
            name: "{{ gitlab_edition }}"
            state: present
            update_cache: true
          environment:
            EXTERNAL_URL: "{{ gitlab_external_url }}"
            GITLAB_ROOT_PASSWORD: "{{ gitlab_initial_root_password }}"

        - name: Configure /etc/gitlab/gitlab.rb for VM environment
          ansible.builtin.blockinfile:
            path: /etc/gitlab/gitlab.rb
            marker: "# {mark} ANSIBLE MANAGED GITLAB VM CONFIG"
            block: |
              external_url '{{ gitlab_external_url }}'
              nginx['listen_port'] = {{ gitlab_external_port }}
              nginx['listen_https'] = false
              gitlab_rails['gitlab_shell_ssh_port'] = {{ gitlab_ssh_port }}
              puma['worker_processes'] = {{ gitlab_puma_workers }}
              sidekiq['concurrency'] = {{ gitlab_sidekiq_concurrency }}
              prometheus_monitoring['enable'] = {{ gitlab_prometheus_enable | lower }}
          register: gitlab_rb_config

        - name: Reconfigure GitLab Omnibus when configuration changes
          when: gitlab_rb_config.changed
          ansible.builtin.command: gitlab-ctl reconfigure

    - name: Provision GitLab via Docker Compose
      when: gitlab_install_method == "docker"
      block:
        - name: Install Docker and Docker Compose plugin
          ansible.builtin.apt:
            name:
              - docker.io
              - docker-compose-v2
            state: present
            update_cache: true

        - name: Ensure Docker service is running
          ansible.builtin.systemd:
            name: docker
            enabled: true
            state: started

        - name: Create /opt/gitlab directory structure
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: "0755"
          loop:
            - /opt/gitlab
            - /opt/gitlab/config
            - /opt/gitlab/logs
            - /opt/gitlab/data

        - name: Write /opt/gitlab/docker-compose.yml
          ansible.builtin.copy:
            dest: /opt/gitlab/docker-compose.yml
            mode: "0644"
            content: |
              services:
                gitlab:
                  image: gitlab/{{ gitlab_edition }}:latest
                  container_name: gitlab
                  restart: always
                  hostname: '{{ ansible_fqdn | default("gitlab.local") }}'
                  environment:
                    GITLAB_OMNIBUS_CONFIG: |
                      external_url '{{ gitlab_external_url }}'
                      nginx['listen_port'] = {{ gitlab_external_port }}
                      nginx['listen_https'] = false
                      gitlab_rails['gitlab_shell_ssh_port'] = {{ gitlab_ssh_port }}
                      gitlab_rails['initial_root_password'] = '{{ gitlab_initial_root_password }}'
                      puma['worker_processes'] = {{ gitlab_puma_workers }}
                      sidekiq['concurrency'] = {{ gitlab_sidekiq_concurrency }}
                      prometheus_monitoring['enable'] = {{ gitlab_prometheus_enable | lower }}
                  ports:
                    - "{{ gitlab_external_port }}:{{ gitlab_external_port }}"
                    - "2224:22"
                  volumes:
                    - /opt/gitlab/config:/etc/gitlab
                    - /opt/gitlab/logs:/var/log/gitlab
                    - /opt/gitlab/data:/var/opt/gitlab
                  shm_size: '256m'

        - name: Start GitLab Docker Compose stack
          ansible.builtin.command:
            cmd: docker compose up -d
            chdir: /opt/gitlab
          changed_when: true

    - name: Wait for GitLab HTTP endpoint to respond on port {{ gitlab_external_port }}
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ gitlab_external_port }}/-/readiness"
        status_code: [200, 302]
      register: readiness_check
      until: readiness_check.status in [200, 302]
      retries: 60
      delay: 10
      failed_when: false

    - name: Read initial root password if present on disk
      ansible.builtin.slurp:
        src: /etc/gitlab/initial_root_password
      register: root_pw_file
      failed_when: false

    - name: Display GitLab connection information
      ansible.builtin.debug:
        msg:
          - "GitLab URL: {{ gitlab_external_url }}"
          - "Username: root"
          - "Configured Password: {{ gitlab_initial_root_password }}"
