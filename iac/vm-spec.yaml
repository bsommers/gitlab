# Declarative Infrastructure-as-Code Specification for GitLab on Proxmox VE & VirtualBox
# Consumed by gitlab_vm.py and scripts/*.sh

vm:
  name: "gitlab-server"
  # Hypervisor provider: "proxmox", "virtualbox", or "auto"
  provider: "proxmox"
  # Auto-detected if set to "auto" (Ubuntu24_LTS_arm64 on Apple Silicon, Ubuntu24_LTS_64 on x86_64)
  ostype: "auto"
  cpus: 4
  memory_mb: 8192
  disk_size_gb: 40
  vram_mb: 33
  firmware: "efi"
  rtc_use_utc: true

proxmox:
  # Proxmox VE REST API endpoint and target node
  api_url: "https://192.168.1.62:8006"
  node: "pve"
  vmid: 112
  template_vmid: 9000
  storage: "stor3"
  bridge: "vmbr0"
  insecure_tls: true
  # API token read from env (PROXMOX_API_TOKEN / CVM_PROXMOX_TOKEN) or gitignored file (.state/proxmox/api_token)
  api_token_env: "PROXMOX_API_TOKEN"
  api_token_file: ".state/proxmox/api_token"
  # Never overwrite, re-clone, reconfigure, or destroy an existing VM on Proxmox
  protect_existing: true

image:
  # Ubuntu 24.04 LTS (Noble Numbat) official cloud image
  release: "24.04"
  codename: "noble"
  # Architecture is auto-resolved ("arm64" or "amd64") when set to "auto"
  arch: "auto"
  base_url: "https://cloud-images.ubuntu.com/noble/current"

network:
  # Primary adapter is NAT with host port forwarding so the VM works anywhere out-of-the-box
  adapter1:
    type: "nat"
    nic_type: "virtio"
    port_forwards:
      ssh:
        protocol: "tcp"
        host_ip: "127.0.0.1"
        host_port: 2222
        guest_port: 22
      http:
        protocol: "tcp"
        host_ip: "0.0.0.0"
        host_port: 8080
        guest_port: 8080
      https:
        protocol: "tcp"
        host_ip: "0.0.0.0"
        host_port: 8443
        guest_port: 8443
      git_ssh:
        protocol: "tcp"
        host_ip: "0.0.0.0"
        host_port: 2224
        guest_port: 22

  # Optional second adapter (e.g., "bridged" or "hostonly" or "none")
  adapter2:
    type: "none"
    interface: ""

auth:
  ssh_user: "ubuntu"
  # Path to local SSH keypair (auto-generated in .state/ssh/id_ed25519 if not present)
  ssh_key_path: ".state/ssh/id_ed25519"
  hostname: "gitlab.local"

gitlab:
  # Installation method inside the VM: "omnibus" (official gitlab-ce package) or "docker"
  install_method: "omnibus"
  edition: "gitlab-ce"
  # Host/port used to construct the external_url (e.g., http://localhost:8080)
  external_host: "localhost"
  external_protocol: "http"
  external_port: 8080
  ssh_port: 2222
  # Initial root password (must be at least 8 characters; if empty, auto-generated by GitLab)
  initial_root_password: "GitLabRoot!2026"
  # Tune Omnibus Puma/Sidekiq memory footprint for single-VM deployment
  tune_for_vm: true
  puma_workers: 2
  sidekiq_concurrency: 10
  prometheus_monitoring_enable: false
